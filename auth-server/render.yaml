services:
  - type: web
    name: jergan-account
    runtime: node
    rootDir: auth-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AUTHPRO_USER
        sync: false
      - key: AUTHPRO_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
